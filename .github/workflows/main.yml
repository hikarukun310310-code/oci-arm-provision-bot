name: OCI Ampere Auto Create
on:
  schedule:
    - cron: '*/5 * * * *' # 5分おきに全自動実行
  workflow_dispatch: # 手動実行ボタン

jobs:
  run-orm:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI SDK and Run Python Script
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_KEY_FILE: ${{ secrets.OCI_KEY_FILE }}
          OCI_STACK_ID: ${{ secrets.OCI_STACK_ID }}
        run: |
          # 権限問題を回避するためにユーザー環境に直接インストール
          pip install oci --user --quiet
          
          # Pythonスクリプトをその場で作成して実行
          python3 -c '
          import os, re, sys
          # インストールしたパスをPythonに認識させる
          import site
          sys.path.append(site.getusersitepackages())
          import oci

          # configと鍵ファイルの復元
          os.makedirs(os.path.expanduser("~/.oci"), exist_ok=True)
          config_text = os.environ["OCI_CONFIG"]
          key_text = os.environ["OCI_KEY_FILE"]
          
          key_path = os.path.expanduser("~/.oci/oci_api_key.pem")
          with open(key_path, "w") as f:
              f.write(key_text.strip() + "\n")
              
          config_text = re.sub(r"key_file\s*=.*", f"key_file={key_path}", config_text)
          if "key_file" not in config_text:
              config_text += f"\nkey_file={key_path}"
              
          config_path = os.path.expanduser("~/.oci/config")
          with open(config_path, "w") as f:
              f.write(config_text.strip() + "\n")

          # OCIのスタック実行ジョブを投入
          config = oci.config.from_file()
          rm_client = oci.resource_manager.ResourceManagerClient(config)
          
          print("Connecting to OCI and applying your stack...")
          job_details = oci.resource_manager.models.CreateApplyJobDetails(
              execution_plan_strategy="FROM_STACK_COMPARE_IMAGE_IDS"
          )
          request_details = oci.resource_manager.models.CreateJobDetails(
              stack_id=os.environ["OCI_STACK_ID"],
              job_operation_details=job_details,
              display_name="Auto_Create_Minecraft_Server"
          )
          
          response = rm_client.create_job(request_details)
          print(f"Job successfully created! Job ID: {response.data.id}")
          '
